participant:
  id: '21'
  age: 26
  resting_hr: 97
  week_number: 3
  group: A
  test: false
  start_date: '2026-04-15'
  last_session_date: '2026-05-06'
  week_mode: auto
  week_interval_days: 7
pepper:
  ip: 192.168.8.107
  port: 9559
study_order:
  groups:
    A:
    - exercise_coach
    - social_buddy
    B:
    - social_buddy
    - exercise_coach
exercise_coach:
  robot_style: 5
  round_num: 1
  set_length: 40
  rest_time: 40
  exercise_list:
  - bicep_curls
  - bicep_curls
  - lateral_raises
  - lateral_raises
  verbal_cadence: 2
  nonverbal_cadence: 2
  rosbag:
    enabled: true
    record_all: true
    topics:
    - /heart_rate
    - /joint_angles
    - /pepper_text_request
    - /pepper_action_request
    - /pepper_camera/image_raw
    output_dir: bags
    restart_on_exit: true
    restart_delay_sec: 5
social_buddy:
  generate_summary_after_session: false
  summary_prompt_file: summaryPrompt.txt
  summary_model: gpt-4o
  summary_max_tokens: 250
adaptive_single_robot:
  enabled: true
  strategy: rule_based_v1
  interaction_state: PRE_SESSION_CHECKIN
  session_flow: coach_then_social
  signals:
    heart_rate_zone: medium
    movement_quality: medium
    social_engagement: medium
  session_state:
    fatigue: medium
    frustration: low
    current_mood: neutral
    current_energy: medium
    speech_responsiveness: medium
    form_quality: medium
    rep_progress: 0.0
  user_model:
    baseline_chattiness: 0.5
    preferred_feedback_style: encouraging
    correction_tolerance: 0.5
    preferred_social_role: exercise_partner
    motivation_style: encouraging
    preferred_autonomy_level: 0.5
  defaults:
    coach_intensity: medium
    social_warmth: medium
    social_verbosity: medium
